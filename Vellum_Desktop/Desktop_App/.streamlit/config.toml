[server]
port = 8501
headless = false

[browser]
gatherUsageStats = false

# ─────────────────────────────────────────────────────────────────────────────
# Apple Human Interface Guidelines (macOS Sequoia Design Tokens)
# Canvas: #f5f5f7 (System Gray 6 / Window Background)
# Primary: #007aff (Apple System Blue)
# Surface: #ffffff (Pure White Card / Control Fill)
# Text:    #1d1d1f (System Primary Label)
# ─────────────────────────────────────────────────────────────────────────────
[theme]
base = "light"
primaryColor = "#007aff"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
font = "sans serif"
