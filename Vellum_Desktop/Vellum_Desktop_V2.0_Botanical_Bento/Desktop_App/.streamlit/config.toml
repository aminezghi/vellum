[server]
port = 8501
headless = false

[browser]
gatherUsageStats = false

# ─────────────────────────────────────────────────────────────────────────────
# Theme modelled on Wispr Flow (https://wisprflow.ai).
# Tokens:
#   lumen      #FFFFEB warm ivory cream canvas
#   lumen-dark #E4E4D0 warm cream border and card outlines
#   vast       #1A1A1A deep rich charcoal black
#   flare      #FF6C4C signature vibrant terracotta coral
#   glow       #FFA946 sunset amber highlight
#   dawn       #F0D7FF lilac accent
#   fathom     #034F46 deep forest teal
# ─────────────────────────────────────────────────────────────────────────────
[theme]
base = "light"
primaryColor = "#ff6c4c"
backgroundColor = "#ffffeb"
secondaryBackgroundColor = "#ffffff"
textColor = "#1a1a1a"
font = "sans serif"
