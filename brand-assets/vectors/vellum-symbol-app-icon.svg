<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><title>Vellum Logo Symbol</title><rect width="256" height="256" rx="57.6" fill="#0B0F19"/><g transform="translate(11.52 4.92) scale(0.455)">
  
  <g id="vellum-mark">
    <!-- Left Manuscript Blade (Illuminated Emerald) -->
